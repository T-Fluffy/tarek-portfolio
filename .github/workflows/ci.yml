name: CI

on:
  push:
    branches: [master]
  pull_request:

# Least privilege by default; jobs that need more declare it themselves.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # security-events: write is needed for the SARIF upload below.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      # Install pinned versions from the committed lockfile, lifecycle scripts blocked.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-fund

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ""
          VITE_BASE_PATH: /tarek-portfolio/
          # Cloudflare test site key (public, always passes): build only needs the widget to render.
          VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA

      # Fails the job when vulnerabilities are found; the SARIF upload below
      # surfaces them in the repository Security tab instead of a dead file.
      - name: Scan lockfile for known vulnerabilities
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --format=sarif
            --output=osv-scanner.sarif
            .

      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          sarif_file: osv-scanner.sarif
          category: osv-scanner

  docker:
    name: Docker image build + Trivy scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --build-arg VITE_API_URL="" --build-arg VITE_BASE_PATH=/ --build-arg VITE_TURNSTILE_SITE_KEY=1x00000000000000000000AA -t tarek-portfolio:ci .

      - name: Scan image for CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tarek-portfolio:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
