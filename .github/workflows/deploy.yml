name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# gh-pages pushes the built site to the gh-pages branch.
permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-fund

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build
        env:
          # Render backend URL - configure as a repository secret named VITE_API_URL.
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_BASE_PATH: /tarek-portfolio/

      - name: Publish to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npx --no-install gh-pages -d dist -r "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"