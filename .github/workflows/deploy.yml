name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# gh-pages pushes the built site to the gh-pages branch, so write access
# is scoped to the deploy job instead of the whole workflow.
permissions:
  contents: read

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-fund

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build
        env:
          # Render backend URL - configure as a repository secret named VITE_API_URL.
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_BASE_PATH: /tarek-portfolio/
          # Cloudflare Turnstile site key (public) - repository secret named VITE_TURNSTILE_SITE_KEY.
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          # Page title baked into index.html (%VITE_APP_TITLE%); public text, no secret needed.
          VITE_APP_TITLE: "TFluffy's Portfolio"

      - name: Publish to gh-pages branch
        # gh-pages clones into a temp dir, so it cannot reuse checkout's
        # persisted credentials: the token must travel in the push URL.
        # It stays masked (GitHub masks secrets) and now flows via env
        # instead of an inline expression.
        env:
          GH_PAGES_REPO: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npx --no-install gh-pages -d dist -r "$GH_PAGES_REPO"