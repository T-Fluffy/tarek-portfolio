name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# gh-pages pushes the built site to the gh-pages branch, so write access
# is scoped to the deploy job instead of the whole workflow.
permissions:
  contents: read

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-fund

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build
        env:
          # Render backend URL - configure as a repository secret named VITE_API_URL.
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_BASE_PATH: /tarek-portfolio/
          # Cloudflare Turnstile site key (public) - repository secret named VITE_TURNSTILE_SITE_KEY.
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}

      - name: Publish to gh-pages branch
        # No -r URL and no token in the command: actions/checkout persists
        # credentials by default, so pushing to `origin` just works and the
        # token never appears in workflow text or logs.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npx --no-install gh-pages -d dist