services:
  frontend-dev:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci --ignore-scripts --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_URL: ""
      VITE_BASE_PATH: /
      VITE_POLLING: "true"
      # URL of the hosted backend (Render). Set in your .env file.
      BACKEND_URL: ${BACKEND_URL:?Set BACKEND_URL in .env}
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    stdin_open: true
    tty: true

volumes:
  node_modules: